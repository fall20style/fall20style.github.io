{% if page.mermaid %}
<script type="module">
  import mermaid from 'https://jsdelivr.net';
  
  document.addEventListener('DOMContentLoaded', function() {
    // 1. 모든 mermaid 코드 블록 찾기
    const codeBlocks = document.querySelectorAll('pre.language-mermaid, .language-mermaid pre, code.language-mermaid');
    
    codeBlocks.forEach((block, index) => {
      // 2. 텍스트 내용 추출 (태그 제외 오직 텍스트만)
      const content = block.innerText || block.textContent;
      
      // 3. 새로운 div 생성
      const div = document.createElement('div');
      div.className = 'mermaid';
      div.innerHTML = content.trim();
      
      // 4. 기존 code/pre 블록을 div로 교체
      const parent = block.closest('div.highlighter-rouge') || block.closest('pre');
      if (parent) {
        parent.replaceWith(div);
      } else {
        block.replaceWith(div);
      }
    });

    // 5. Mermaid 초기화
    mermaid.initialize({ startOnLoad: true, theme: 'default' });
  });
</script>

<style>
  /* 렌더링 전 글자가 잠깐 보이는 현상 방지 */
  .language-mermaid { display: none; }
  .mermaid { display: block !important; }
</style>
{% endif %}



<!-- ======= Mermaid.js 지원 설정 ======= -->
<script type="module">
  import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs';
  
  // Kramdown이 컴파일한 <pre><code class="language-mermaid"> 구조를 
  // Mermaid가 인식할 수 있는 <pre class="mermaid"> 형태로 변환 후 초기화
  document.addEventListener("DOMContentLoaded", function () {
    const mermaidBlocks = document.querySelectorAll('pre code.language-mermaid');
    mermaidBlocks.forEach((block) => {
      const pre = block.parentNode;
      const code = block.textContent;
      
      // 새로운 pre 태그 생성 및 클래스 부여
      const newPre = document.createElement('pre');
      newPre.className = 'mermaid';
      newPre.textContent = code;
      
      // 기존 구조를 교체
      pre.parentNode.replaceChild(newPre, pre);
    });
    
    // Mermaid 엔진 작동
    mermaid.initialize({ startOnLoad: true, theme: 'default' });
  });
</script>


<!-- end custom head snippets -->
